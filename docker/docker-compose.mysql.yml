services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pointofsale}
      MARIADB_DATABASE: ospos
    volumes:
      - ospos-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  ospos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_DRIVER: mysql
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-pointofsale}@mariadb:3306/ospos
      ALLOWED_HOSTNAMES: localhost,127.0.0.1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    restart: unless-stopped

volumes:
  ospos-mysql: