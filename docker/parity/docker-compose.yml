services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --default-time-zone=+06:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ospos
      MYSQL_USER: ospos
      MYSQL_PASSWORD: ospos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uospos", "-pospos"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql

  oracle:
    # Build with scripts/parity/build-oracle.sh (classic builder, staged
    # read-only copy of upstream) because additional contexts need buildx.
    image: parity-oracle:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CI_ENVIRONMENT: production
      app.baseURL: http://oracle/
      ALLOWED_HOSTNAMES: oracle,localhost,localhost:8088,127.0.0.1
      DB_HOST: mysql
    ports:
      - "8088:80"

  target:
    profiles: ["target"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DRIVER: mysql
      DATABASE_URL: mysql://ospos:ospos@mysql:3306/ospos
      AUTH_SECRET: parity-secret
      NEXTAUTH_URL: http://target:3000
      ALLOWED_HOSTNAMES: target,localhost
    ports:
      - "3008:3000"
